name: Fully Automated Cloud-Native Pipeline

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

# Ensure only one run per branch occurs at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: CI/Test - Runs on Pull Requests
  ci-test:
    name: "CI/Test (Ubuntu ARM)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Placeholder Tests
        run: |
          chmod +x tests/run-tests.sh
          ./tests/run-tests.sh

  # Job 2: Pro Training - Runs on Push to Develop
  pro-training:
    name: "Pro Training (Ubuntu ARM)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04-arm
    outputs:
      best_model_path: ${{ steps.locate_model.outputs.best_model }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Train YOLO Model
        run: |
          siin-trainer train-ultralytics \
            --data tests/dataset_tiny/data.yaml \
            --model yolov8n \
            --epochs 100 \
            --img-size 320 \
            --batch 8 \
            --device cpu \
            --workers 2

      - name: Locate Best Model
        id: locate_model
        run: |
          BEST_MODEL=$(ls -t runs/ultralytics/*/weights/best.pt | head -n 1)
          echo "best_model=$BEST_MODEL" >> $GITHUB_OUTPUT
          
          # Base directory for exports
          BASE_DIR=$(dirname "$BEST_MODEL")
          echo "base_dir=$BASE_DIR" >> $GITHUB_OUTPUT

      - name: Export Model (ONNX)
        run: |
          MODEL_PATH="${{ steps.locate_model.outputs.best_model }}"
          echo "Exporting $MODEL_PATH to ONNX..."
          yolo export model="$MODEL_PATH" format=onnx

      - name: Upload Training Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-models-linux
          path: |
            ${{ steps.locate_model.outputs.best_model }}
            ${{ steps.locate_model.outputs.base_dir }}/best.onnx

  # Job 3: Export CoreML - Runs on macOS 14 for native support
  export-coreml:
    name: "Export CoreML (macOS ARM)"
    needs: pro-training
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Download Training Artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-models-linux
          path: trained-models

      - name: Install Export Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics coremltools

      - name: Export Model (CoreML)
        run: |
          # Find the model file in the downloaded directory
          MODEL_PATH=$(find trained-models -name "best.pt" | head -n 1)
          echo "Exporting $MODEL_PATH to CoreML..."
          yolo export model="$MODEL_PATH" format=coreml

      - name: Upload CoreML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-coreml
          path: trained-models/best.mlpackage

  # Job 4: Create Release - Runs after both conversions are done
  create-release:
    name: "Automated Release"
    needs: [pro-training, export-coreml]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Tag and Release Name
        id: tag
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y.%m.%d')
          TAG="v${DATE}-${SHA_SHORT}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated Tag: $TAG"

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-models-linux
          path: release-assets

      - name: Download CoreML Artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-model-coreml
          path: release-assets/best.mlpackage

      - name: Package CoreML
        run: |
          cd release-assets
          if [ -d "best.mlpackage" ]; then
            zip -r best_coreml.zip best.mlpackage
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            Automated release generated from develop branch.
            Commit: ${{ github.sha }}
            
            Multi-platform assets included:
            - PyTorch (.pt)
            - ONNX (.onnx)
            - CoreML (zipped .mlpackage)
          files: |
            release-assets/best.pt
            release-assets/best.onnx
            release-assets/best_coreml.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
